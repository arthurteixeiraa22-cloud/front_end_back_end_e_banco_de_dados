<!DOCTYPE html>
<!-- TELA 1: LOGIN (endereço: /criptografia.html) -->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar</title>
    <style>
        /* Para mudar as cores do site, altere só estas variáveis */
        :root {
            --cor: #6366f1;
            --cor-escura: #4f46e5;
            --fundo: #eef0ff;
            --cartao: #ffffff;
            --texto: #1e1b4b;
            --texto-suave: #6b7280;
            --borda: #d9dbf0;
            --erro: #dc2626;
            --erro-fundo: #fef2f2;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --fundo: #11122b; --cartao: #1b1c3d; --texto: #f1f2ff;
                --texto-suave: #9ca3c9; --borda: #33356b; --erro-fundo: #3b1a22;
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            color: var(--texto); padding: 20px;
            background: radial-gradient(circle at 15% 20%, rgba(99,102,241,.35), transparent 45%),
                        radial-gradient(circle at 85% 80%, rgba(168,85,247,.3), transparent 45%),
                        var(--fundo);
        }
        .caixa {
            width: 100%; max-width: 400px; background: var(--cartao); padding: 40px 32px;
            border-radius: 20px; box-shadow: 0 20px 50px rgba(79,70,229,.18);
        }
        .logo {
            width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px;
            display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--cor), #a855f7);
        }
        h1 { margin: 0 0 6px; text-align: center; font-size: 26px; }
        .sub { margin: 0 0 28px; text-align: center; color: var(--texto-suave); font-size: 14px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
        input {
            width: 100%; padding: 12px 14px; margin-bottom: 18px; font-size: 15px;
            color: var(--texto); background: transparent;
            border: 1.5px solid var(--borda); border-radius: 10px; outline: none;
            transition: border-color .2s, box-shadow .2s;
        }
        input:focus { border-color: var(--cor); box-shadow: 0 0 0 4px rgba(99,102,241,.18); }
        button {
            width: 100%; padding: 13px; font-size: 16px; font-weight: 600; color: #fff;
            border: none; border-radius: 10px; cursor: pointer;
            background: linear-gradient(135deg, var(--cor), var(--cor-escura));
            transition: transform .1s, box-shadow .2s, opacity .2s;
        }
        button:hover { box-shadow: 0 8px 20px rgba(79,70,229,.35); }
        button:active { transform: scale(.98); }
        button:disabled { opacity: .7; cursor: wait; }
        #mensagem {
            display: none; margin: 16px 0 0; padding: 12px; text-align: center;
            font-size: 14px; border-radius: 10px; color: var(--erro); background: var(--erro-fundo);
        }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="logo">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
        </div>
        <h1>Bem-vindo de volta</h1>
        <p class="sub">Entre com seu email e senha para continuar</p>

        <form id="formLogin">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="voce@email.com" required autofocus>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>

            <button type="submit" id="btnEntrar">Entrar</button>
        </form>

        <p id="mensagem"></p>
    </div>

    <script>
        
        document.getElementById("formLogin").addEventListener("submit", async (e) => {
            e.preventDefault(); // impede a página de recarregar

            const btn = document.getElementById("btnEntrar");
            const msg = document.getElementById("mensagem");
            msg.style.display = "none";
            btn.disabled = true;
            btn.textContent = "Entrando...";

            // Envia email e senha NORMAIS: quem compara com o hash é o Java
            const dados = new URLSearchParams({
                email: document.getElementById("email").value,
                senha: document.getElementById("senha").value
            });

            try {
                const resposta = await fetch("/login", { method: "POST", body: dados });
                const texto = await resposta.text();

                if (resposta.ok) {
                    // LOGIN CERTO: abre a tela 2
                    window.location.href = "/home.html";
                    return;
                }
                // LOGIN ERRADO: mostra a mensagem
                msg.textContent = texto;
            } catch (erro) {
                msg.textContent = "Não foi possível conectar ao servidor.";
            }

            msg.style.display = "block";
            btn.disabled = false;
            btn.textContent = "Entrar";
        });
    </script>
</body>
</html>
